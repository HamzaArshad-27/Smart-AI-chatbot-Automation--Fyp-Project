{% load static %}
<style>
  /* ==========================================================================
     VENDORA AI SHOPPING ASSISTANT - PROFESSIONAL WIDGET STYLING
     ========================================================================== */

  :root {
    --v-primary: #2563eb;
    --v-primary-hover: #1d4ed8;
    --v-primary-light: #eff6ff;
    --v-primary-border: #bfdbfe;
    --v-dark: #0f172a;
    --v-dark-surface: #1e293b;
    --v-gray-bg: #f8fafc;
    --v-border: #e2e8f0;
    --v-text-main: #0f172a;
    --v-text-muted: #64748b;
    --v-danger: #ef4444;
    --v-danger-light: #fef2f2;
    --v-success: #10b981;
    --v-radius-lg: 18px;
    --v-radius-md: 12px;
    --v-radius-sm: 8px;
    --v-shadow-window: 0 20px 45px -10px rgba(15, 23, 42, 0.25), 0 0 1px 1px rgba(15, 23, 42, 0.05);
    --v-shadow-toggle: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
  }

  /* Base container */
  .vendora-chatbot {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 1080;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* Floating trigger button */
  .vendora-chat-toggle {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    color: #ffffff;
    box-shadow: var(--v-shadow-toggle);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    font-size: 24px;
    position: relative;
    outline: none;
  }

  .vendora-chat-toggle:hover {
    transform: scale(1.08) translateY(-2px);
    box-shadow: 0 14px 30px -4px rgba(37, 99, 235, 0.55);
  }

  .vendora-chat-toggle:active {
    transform: scale(0.96);
  }

  .vendora-chat-toggle .badge-dot {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 13px;
    height: 13px;
    background: #10b981;
    border: 2px solid #ffffff;
    border-radius: 50%;
  }

  /* Chat window main container */
  .vendora-chat-window {
    position: absolute;
    right: 0;
    bottom: 76px;
    width: 400px;
    height: 590px;
    background: #ffffff;
    border-radius: var(--v-radius-lg);
    box-shadow: var(--v-shadow-window);
    border: 1px solid var(--v-border);
    overflow: hidden;
    display: none;
    flex-direction: column;
    opacity: 0;
    transform: translateY(16px) scale(0.96);
    transform-origin: bottom right;
    transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .vendora-chat-window.open {
    display: flex;
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* Fullscreen Mode */
  .vendora-chat-window.fullscreen {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100vw !important;
    height: 100vh !important;
    border-radius: 0 !important;
    z-index: 9999;
    box-shadow: none;
    border: none;
  }

  /* Window Header */
  .vendora-chat-header {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .vendora-chat-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .vendora-avatar-wrap {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 17px;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    position: relative;
  }

  .vendora-avatar-wrap .status-indicator-dot {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #10b981;
    border: 2px solid #0f172a;
  }

  .vendora-header-info {
    display: flex;
    flex-direction: column;
  }

  .vendora-chat-header-title {
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: -0.01em;
    color: #ffffff;
  }

  .vendora-chat-header-sub {
    font-size: 0.75rem;
    color: #94a3b8;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .vendora-chat-header-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .vendora-chat-header-btn {
    background: rgba(255, 255, 255, 0.08);
    border: none;
    color: #e2e8f0;
    width: 32px;
    height: 32px;
    border-radius: var(--v-radius-sm);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 13px;
    outline: none;
  }

  .vendora-chat-header-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    color: #ffffff;
    transform: translateY(-1px);
  }

  .vendora-chat-header-btn.danger:hover {
    background: rgba(239, 68, 68, 0.25);
    color: #fca5a5;
  }

  /* Clear Confirmation Banner */
  .vendora-clear-confirm {
    background: #fff1f2;
    border-bottom: 1px solid #fecdd3;
    padding: 8px 14px;
    display: none;
    align-items: center;
    justify-content: space-between;
    font-size: 0.8rem;
    color: #9f1239;
  }

  .vendora-clear-confirm button {
    font-size: 0.75rem;
    padding: 3px 8px;
    border-radius: 4px;
    cursor: pointer;
    border: none;
  }

  .vendora-clear-confirm .btn-confirm {
    background: #e11d48;
    color: #fff;
  }

  .vendora-clear-confirm .btn-cancel {
    background: transparent;
    color: #4b5563;
  }

  /* Messages Area */
  .vendora-chat-messages {
    flex: 1;
    overflow-y: auto;
    background: var(--v-gray-bg);
    padding: 16px 14px;
    height: 100%;
    scroll-behavior: smooth;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .vendora-chat-messages::-webkit-scrollbar {
    width: 5px;
  }

  .vendora-chat-messages::-webkit-scrollbar-track {
    background: transparent;
  }

  .vendora-chat-messages::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 10px;
  }

  .vendora-chat-messages::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }

  /* Message Row */
  .vendora-msg-row {
    display: flex;
    flex-direction: column;
    max-width: 86%;
    animation: vendoraSlideUp 0.25s ease-out;
  }

  .vendora-msg-row.user {
    align-self: flex-end;
    align-items: flex-end;
  }

  .vendora-msg-row.bot {
    align-self: flex-start;
    align-items: flex-start;
  }

  @keyframes vendoraSlideUp {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Bubbles */
  .vendora-chat-bubble {
    padding: 11px 15px;
    border-radius: var(--v-radius-md);
    font-size: 0.9rem;
    line-height: 1.55;
    word-wrap: break-word;
    position: relative;
  }

  .vendora-msg-row.user .vendora-chat-bubble {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    color: #ffffff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
  }

  .vendora-msg-row.bot .vendora-chat-bubble {
    background: #ffffff;
    color: var(--v-text-main);
    border: 1px solid var(--v-border);
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
  }

  /* Formatted elements inside bot bubbles */
  .vendora-chat-bubble strong {
    font-weight: 600;
    color: inherit;
  }

  .vendora-chat-bubble a {
    color: var(--v-primary);
    text-decoration: underline;
    font-weight: 500;
  }

  .vendora-chat-bubble ul, .vendora-chat-bubble ol {
    margin: 6px 0 6px 18px;
    padding: 0;
  }

  .vendora-chat-bubble li {
    margin-bottom: 4px;
  }

  /* Timestamp & Actions Row */
  .vendora-msg-meta {
    font-size: 0.68rem;
    color: var(--v-text-muted);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 2px;
  }

  .vendora-copy-btn {
    background: transparent;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    font-size: 0.7rem;
    padding: 0 3px;
    transition: color 0.15s ease;
  }

  .vendora-copy-btn:hover {
    color: var(--v-primary);
  }

  /* Typing Dots Indicator */
  .vendora-typing-bubble {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 12px 16px;
    background: #ffffff;
    border: 1px solid var(--v-border);
    border-radius: var(--v-radius-md);
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
  }

  .vendora-typing-bubble span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #94a3b8;
    animation: vendoraTyping 1.3s infinite;
  }

  .vendora-typing-bubble span:nth-child(2) {
    animation-delay: 0.2s;
  }

  .vendora-typing-bubble span:nth-child(3) {
    animation-delay: 0.4s;
  }

  @keyframes vendoraTyping {
    0%, 60%, 100% {
      transform: translateY(0);
      opacity: 0.35;
    }
    30% {
      transform: translateY(-5px);
      opacity: 1;
      background: var(--v-primary);
    }
  }

  /* Stop Generating Control Banner */
  .vendora-stop-banner {
    display: none;
    align-items: center;
    justify-content: center;
    padding: 8px 12px;
    background: #f8fafc;
    border-top: 1px solid var(--v-border);
    animation: fadeIn 0.2s ease;
  }

  .vendora-stop-btn {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    color: #475569;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 5px 14px;
    border-radius: 20px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
    box-shadow: 0 2px 5px rgba(0,0,0,0.04);
  }

  .vendora-stop-btn:hover {
    background: #fee2e2;
    border-color: #fca5a5;
    color: #dc2626;
  }

  .vendora-stop-btn i {
    font-size: 0.75rem;
  }

  /* Product Suggestions Cards Grid */
  .vendora-product-cards-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
    width: 100%;
  }

  .vendora-card-item {
    background: #ffffff;
    border: 1px solid #dbeafe;
    border-radius: var(--v-radius-md);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: all 0.2s ease;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 4px rgba(37, 99, 235, 0.04);
  }

  .vendora-card-item:hover {
    border-color: #93c5fd;
    background: #f8faff;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(37, 99, 235, 0.1);
  }

  .vendora-card-title {
    font-weight: 600;
    font-size: 0.88rem;
    color: #0f172a;
    line-height: 1.35;
  }

  .vendora-card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }

  .vendora-card-price {
    font-weight: 700;
    font-size: 0.92rem;
    color: #2563eb;
  }

  .vendora-card-badge {
    font-size: 0.72rem;
    padding: 2px 8px;
    background: #eff6ff;
    color: #1e40af;
    border-radius: 12px;
    font-weight: 500;
  }

  .vendora-card-action {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.78rem;
    font-weight: 600;
    color: #2563eb;
    margin-top: 2px;
  }

  /* Quick Replies Bar */
  .vendora-quick-replies {
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 14px 10px;
    background: #ffffff;
    border-top: 1px solid #f1f5f9;
    max-height: 95px;
    overflow-y: auto;
  }

  .quick-reply-btn {
    padding: 6px 12px;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    background: #f8fafc;
    color: #334155;
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    white-space: nowrap;
    outline: none;
  }

  .quick-reply-btn:hover {
    background: #2563eb;
    color: #ffffff;
    border-color: #2563eb;
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
  }

  .quick-reply-btn:active {
    transform: scale(0.96);
  }

  /* Chat Input Section */
  .vendora-chat-input-area {
    border-top: 1px solid var(--v-border);
    padding: 10px 14px;
    background: #ffffff;
    flex-shrink: 0;
  }

  .vendora-input-wrapper {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f8fafc;
    border: 1.5px solid #e2e8f0;
    border-radius: var(--v-radius-md);
    padding: 4px 6px 4px 12px;
    transition: all 0.2s ease;
  }

  .vendora-input-wrapper:focus-within {
    background: #ffffff;
    border-color: var(--v-primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }

  .vendora-input-field {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 0.9rem;
    color: var(--v-text-main);
    outline: none;
    padding: 6px 0;
    min-height: 22px;
  }

  .vendora-input-field::placeholder {
    color: #94a3b8;
  }

  .vendora-input-field:disabled {
    cursor: not-allowed;
    color: #94a3b8;
  }

  /* Send/Action Button */
  .vendora-send-btn {
    width: 36px;
    height: 36px;
    border-radius: var(--v-radius-sm);
    background: var(--v-primary);
    color: #ffffff;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 14px;
    outline: none;
    flex-shrink: 0;
  }

  .vendora-send-btn:hover:not(:disabled) {
    background: var(--v-primary-hover);
    transform: scale(1.05);
  }

  .vendora-send-btn:disabled {
    background: #cbd5e1;
    cursor: not-allowed;
    transform: none;
  }

  /* When generating, send button acts as Stop */
  .vendora-send-btn.is-stop {
    background: #ef4444 !important;
    color: #ffffff !important;
  }

  .vendora-send-btn.is-stop:hover {
    background: #dc2626 !important;
  }

  /* Status Bar */
  .vendora-chat-statusbar {
    font-size: 0.72rem;
    color: #64748b;
    padding: 4px 14px 6px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid #f8fafc;
    flex-shrink: 0;
  }

  .vendora-status-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .vendora-status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10b981;
  }

  .vendora-status-dot.offline {
    background: #ef4444;
  }

  .vendora-status-dot.busy {
    background: #f59e0b;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Guest popup */
  .vendora-chat-guest {
    width: 320px;
    background: #ffffff;
    border-radius: var(--v-radius-md);
    border: 1px solid var(--v-border);
    box-shadow: 0 16px 36px rgba(15, 23, 42, 0.2);
    padding: 22px 20px;
    display: none;
    position: absolute;
    right: 0;
    bottom: 76px;
    animation: vendoraSlideUp 0.2s ease;
  }

  .vendora-chat-guest h5 {
    color: #0f172a;
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .vendora-chat-guest p {
    color: #64748b;
    font-size: 0.88rem;
    line-height: 1.5;
    margin-bottom: 18px;
  }

  .vendora-chat-guest .btn-group {
    display: flex;
    gap: 10px;
  }

  .vendora-chat-guest .btn-auth {
    flex: 1;
    padding: 9px 0;
    border-radius: var(--v-radius-sm);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    text-align: center;
    transition: all 0.2s ease;
  }

  .vendora-chat-guest .btn-auth.primary {
    background: var(--v-primary);
    color: #ffffff;
  }

  .vendora-chat-guest .btn-auth.primary:hover {
    background: var(--v-primary-hover);
  }

  .vendora-chat-guest .btn-auth.secondary {
    background: #f1f5f9;
    color: #334155;
  }

  .vendora-chat-guest .btn-auth.secondary:hover {
    background: #e2e8f0;
  }

  /* Responsive styling */
  @media (max-width: 576px) {
    .vendora-chatbot {
      right: 14px;
      bottom: 14px;
    }

    .vendora-chat-window {
      width: calc(100vw - 28px);
      height: calc(100vh - 90px);
      bottom: 72px;
      border-radius: 14px;
    }

    .vendora-chat-window.fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      bottom: 0;
      right: 0;
    }

    .vendora-chat-guest {
      width: calc(100vw - 28px);
    }
  }
</style>

<!-- ===== CHATBOT HTML MARKUP ===== -->
<div id="vendoraChatbot" class="vendora-chatbot">
  <!-- Chat Window -->
  <div id="vendoraChatWindow" class="vendora-chat-window" role="dialog" aria-label="Vendora AI Assistant">
    <!-- Header -->
    <div class="vendora-chat-header">
      <div class="vendora-chat-header-left">
        <div class="vendora-avatar-wrap">
          <i class="fas fa-robot"></i>
          <span class="status-indicator-dot" id="vendoraHeaderDot"></span>
        </div>
        <div class="vendora-header-info">
          <span class="vendora-chat-header-title">Vendora AI</span>
          <span class="vendora-chat-header-sub" id="vendoraHeaderSub">
            <span style="color: #10b981;">●</span> Shopping Assistant
          </span>
        </div>
      </div>
      <div class="vendora-chat-header-actions">
        <!-- Clear History Button -->
        <button type="button" id="vendoraChatClear" class="vendora-chat-header-btn danger" title="Clear conversation" aria-label="Clear chat">
          <i class="fas fa-trash-alt"></i>
        </button>
        <!-- Full Screen Toggle -->
        <button type="button" id="vendoraChatFullscreen" class="vendora-chat-header-btn" title="Toggle full screen" aria-label="Full screen">
          <i class="fas fa-expand"></i>
        </button>
        <!-- Minimize/Close Button -->
        <button type="button" id="vendoraChatClose" class="vendora-chat-header-btn" title="Close" aria-label="Close">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <!-- Inline Confirmation for Clear Chat -->
    <div id="vendoraClearConfirm" class="vendora-clear-confirm">
      <span>Clear all chat messages?</span>
      <div>
        <button type="button" id="vendoraConfirmClearBtn" class="btn-confirm">Clear</button>
        <button type="button" id="vendoraCancelClearBtn" class="btn-cancel">Cancel</button>
      </div>
    </div>

    <!-- Scrollable Messages Container -->
    <div id="vendoraChatMessages" class="vendora-chat-messages" tabindex="0"></div>

    <!-- Stop Generating Floating Banner -->
    <div id="vendoraStopBanner" class="vendora-stop-banner">
      <button type="button" id="vendoraStopBtn" class="vendora-stop-btn" title="Stop receiving response">
        <i class="fas fa-stop"></i> Stop generating
      </button>
    </div>

    <!-- Dynamic Quick Replies Chips -->
    <div id="vendoraQuickReplies" class="vendora-quick-replies"></div>

    <!-- Input Box Area -->
    <div class="vendora-chat-input-area">
      <div class="vendora-input-wrapper">
        <input
          id="vendoraChatInput"
          type="text"
          class="vendora-input-field"
          placeholder="Ask for products, styles, prices..."
          maxlength="500"
          autocomplete="off"
        />
        <button
          id="vendoraChatSend"
          type="button"
          class="vendora-send-btn"
          title="Send message (Enter)"
          aria-label="Send"
        >
          <i class="fas fa-arrow-up" id="vendoraSendIcon"></i>
        </button>
      </div>
    </div>

    <!-- Micro Status Bar -->
    <div class="vendora-chat-statusbar">
      <div class="vendora-status-left">
        <span class="vendora-status-dot" id="vendoraStatusDot"></span>
        <span id="vendoraStatusText">Ready to assist</span>
      </div>
      <span style="font-size: 0.65rem; color: #94a3b8;">Press Enter ↵</span>
    </div>
  </div>

  <!-- Guest Prompt Popup (shown when unauthenticated user clicks chat) -->
  <div id="vendoraChatGuest" class="vendora-chat-guest">
    <h5>
      <i class="fas fa-robot" style="color: #2563eb;"></i>
      Vendora AI Shopping Guide
    </h5>
    <p>Sign in or register to get personalized AI product recommendations and instant shopping assistance.</p>
    <div class="btn-group">
      <a href="{% url 'accounts:login' %}" class="btn-auth primary">Sign In</a>
      <a href="{% url 'accounts:register' %}" class="btn-auth secondary">Create Account</a>
    </div>
  </div>

  <!-- Main Floating Toggle Button -->
  <button type="button" id="vendoraChatToggle" class="vendora-chat-toggle" aria-label="Open AI Shopping Assistant">
    <i class="fas fa-comment-dots" id="vendoraToggleIcon"></i>
    <span class="badge-dot"></span>
  </button>
</div>

<!-- ===== CHATBOT SCRIPT LOGIC ===== -->
<script>
  (function() {
    'use strict';

    const isLoggedIn = {{ user.is_authenticated|yesno:"true,false" }};
    const windowEl = document.getElementById("vendoraChatWindow");
    const guestEl = document.getElementById("vendoraChatGuest");
    const toggleBtn = document.getElementById("vendoraChatToggle");
    const toggleIcon = document.getElementById("vendoraToggleIcon");
    const closeBtn = document.getElementById("vendoraChatClose");
    const clearBtn = document.getElementById("vendoraChatClear");
    const clearConfirmEl = document.getElementById("vendoraClearConfirm");
    const confirmClearBtn = document.getElementById("vendoraConfirmClearBtn");
    const cancelClearBtn = document.getElementById("vendoraCancelClearBtn");
    const fullscreenBtn = document.getElementById("vendoraChatFullscreen");
    const sendBtn = document.getElementById("vendoraChatSend");
    const sendIcon = document.getElementById("vendoraSendIcon");
    const inputEl = document.getElementById("vendoraChatInput");
    const messagesEl = document.getElementById("vendoraChatMessages");
    const statusText = document.getElementById("vendoraStatusText");
    const statusDot = document.getElementById("vendoraStatusDot");
    const headerDot = document.getElementById("vendoraHeaderDot");
    const quickRepliesEl = document.getElementById("vendoraQuickReplies");
    const stopBanner = document.getElementById("vendoraStopBanner");
    const stopBtn = document.getElementById("vendoraStopBtn");

    const storageKey = "vendora_chat_history_v2";
    let isProcessing = false;
    let isFullscreen = false;
    let activeAbortController = null;
    let quickReplyTimer = null;

    // ─── CSRF Token ────────────────────────────────────────────────────────────
    function getCsrfToken() {
      const cookie = document.cookie
        .split(";")
        .map((v) => v.trim())
        .find((v) => v.startsWith("csrftoken="));
      return cookie ? decodeURIComponent(cookie.split("=")[1]) : "";
    }

    // ─── Chat History Storage ──────────────────────────────────────────────────
    function getChatHistory() {
      try {
        const data = sessionStorage.getItem(storageKey);
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }

    function saveChatHistory(history) {
      try {
        sessionStorage.setItem(storageKey, JSON.stringify(history));
      } catch (e) {
        console.warn('Unable to persist chat history:', e);
      }
    }

    // ─── Status Updates ────────────────────────────────────────────────────────
    function updateStatus(text, state = 'online') {
      if (statusText) statusText.textContent = text;
      if (statusDot) {
        statusDot.className = 'vendora-status-dot';
        if (state === 'offline') statusDot.classList.add('offline');
        if (state === 'busy') statusDot.classList.add('busy');
      }
      if (headerDot) {
        headerDot.style.background = (state === 'offline') ? '#ef4444' : (state === 'busy') ? '#f59e0b' : '#10b981';
      }
    }

    // ─── Markdown / Text Formatter ─────────────────────────────────────────────
    function formatMessageText(text) {
      if (!text) return "";
      let safe = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      // Bold: **text** -> <strong>text</strong>
      safe = safe.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      // Bullet points
      safe = safe.replace(/^[•\-\*]\s+(.*)$/gm, '<li>$1</li>');
      // Wrap list items
      safe = safe.replace(/(<li>.*<\/li>(\n|$))+/g, '<ul>$&</ul>');
      // URLs to clickable links
      safe = safe.replace(
        /(https?:\/\/[^\s<]+)/g,
        '<a href="$1" target="_blank" rel="noopener noreferrer">$1 <i class="fas fa-external-link-alt" style="font-size: 0.65rem;"></i></a>'
      );
      // Newlines to <br>
      safe = safe.replace(/\n/g, '<br>');
      return safe;
    }

    // ─── Copy to Clipboard ────────────────────────────────────────────────────
    window.vendoraCopyText = function(btn, text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          btn.innerHTML = '<i class="fas fa-check" style="color:#10b981;"></i>';
          setTimeout(() => { btn.innerHTML = '<i class="far fa-copy"></i>'; }, 1500);
        });
      }
    };

    // ─── Message Renderer ──────────────────────────────────────────────────────
    function renderMessage(role, text, suggestions = [], timestamp = null, isStopped = false) {
      const row = document.createElement("div");
      row.className = `vendora-msg-row ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "vendora-chat-bubble";
      bubble.innerHTML = formatMessageText(text);

      if (isStopped) {
        const stopNotice = document.createElement("div");
        stopNotice.style.cssText = "font-size: 0.72rem; color: #dc2626; margin-top: 4px; font-style: italic;";
        stopNotice.textContent = "(Response stopped)";
        bubble.appendChild(stopNotice);
      }

      row.appendChild(bubble);

      // Metadata (timestamp & copy button)
      const meta = document.createElement("div");
      meta.className = "vendora-msg-meta";

      const timeSpan = document.createElement("span");
      const timeDate = timestamp ? new Date(timestamp) : new Date();
      timeSpan.textContent = timeDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      meta.appendChild(timeSpan);

      if (role === "bot" && text) {
        const copyBtn = document.createElement("button");
        copyBtn.className = "vendora-copy-btn";
        copyBtn.title = "Copy reply";
        copyBtn.innerHTML = '<i class="far fa-copy"></i>';
        copyBtn.onclick = function() { window.vendoraCopyText(copyBtn, text); };
        meta.appendChild(copyBtn);
      }

      row.appendChild(meta);
      messagesEl.appendChild(row);

      // Render product suggestion cards if provided
      if (role === "bot" && Array.isArray(suggestions) && suggestions.length > 0) {
        const cardsWrap = document.createElement("div");
        cardsWrap.className = "vendora-product-cards-wrap";

        suggestions.forEach((item) => {
          const card = document.createElement("a");
          card.className = "vendora-card-item";
          const productUrl = item.absolute_url || item.url || "#";
          card.href = productUrl;
          card.target = "_blank";
          card.rel = "noopener noreferrer";

          const title = document.createElement("div");
          title.className = "vendora-card-title";
          title.textContent = item.name || "Product";

          const metaDiv = document.createElement("div");
          metaDiv.className = "vendora-card-meta";

          const price = document.createElement("span");
          price.className = "vendora-card-price";
          const priceVal = parseFloat(item.price || 0);
          price.textContent = `$${priceVal.toFixed(2)}`;

          metaDiv.appendChild(price);

          if (item.category) {
            const catBadge = document.createElement("span");
            catBadge.className = "vendora-card-badge";
            catBadge.textContent = item.category;
            metaDiv.appendChild(catBadge);
          }

          const action = document.createElement("div");
          action.className = "vendora-card-action";
          action.innerHTML = 'View Details <i class="fas fa-chevron-right" style="font-size: 0.65rem;"></i>';

          card.appendChild(title);
          card.appendChild(metaDiv);
          card.appendChild(action);
          cardsWrap.appendChild(card);
        });

        messagesEl.appendChild(cardsWrap);
      }

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ─── Typing Indicator ──────────────────────────────────────────────────────
    function showTyping() {
      removeTyping();
      const row = document.createElement("div");
      row.className = "vendora-msg-row bot";
      row.id = "vendoraTypingRow";

      const bubble = document.createElement("div");
      bubble.className = "vendora-typing-bubble";
      bubble.innerHTML = "<span></span><span></span><span></span>";

      row.appendChild(bubble);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      const typingRow = document.getElementById("vendoraTypingRow");
      if (typingRow) typingRow.remove();
    }

    // ─── Switch Send Button into Stop Mode ─────────────────────────────────────
    function setGeneratingState(generating) {
      isProcessing = generating;
      if (generating) {
        sendBtn.classList.add("is-stop");
        sendBtn.title = "Stop generating";
        sendIcon.className = "fas fa-stop";
        if (stopBanner) stopBanner.style.display = "flex";
        updateStatus("Vendora is thinking...", "busy");
      } else {
        sendBtn.classList.remove("is-stop");
        sendBtn.title = "Send message (Enter)";
        sendIcon.className = "fas fa-arrow-up";
        if (stopBanner) stopBanner.style.display = "none";
        sendBtn.disabled = false;
        inputEl.disabled = false;
        updateStatus("Ready to assist", "online");
        inputEl.focus();
      }
    }

    // ─── Stop / Cancel Active Request ──────────────────────────────────────────
    function stopGenerating() {
      if (activeAbortController && isProcessing) {
        activeAbortController.abort();
        activeAbortController = null;
      }
      removeTyping();
      setGeneratingState(false);
      updateStatus("Response stopped", "online");
    }

    // ─── Render Entire Chat History ────────────────────────────────────────────
    function renderHistory() {
      messagesEl.innerHTML = "";
      const history = getChatHistory();
      if (history.length === 0) {
        renderMessage(
          "bot",
          "👋 Hi there! I'm **Vendora**, your personal shopping assistant.\n\nI can help you find products, compare prices, check categories, and discover trending items.\n\nHow can I help you shop today?",
          [],
          Date.now()
        );
        return;
      }
      history.forEach((entry) => {
        renderMessage(entry.role, entry.text, entry.suggestions || [], entry.timestamp, entry.isStopped);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ─── Quick Replies Handler ─────────────────────────────────────────────────
    function renderQuickReplies(replies) {
      if (!quickRepliesEl) return;
      if (!replies || replies.length === 0) {
        quickRepliesEl.style.display = "none";
        return;
      }

      quickRepliesEl.innerHTML = "";
      quickRepliesEl.style.display = "flex";

      replies.forEach((reply) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "quick-reply-btn";
        btn.textContent = reply.label || reply;
        btn.dataset.message = reply.message || reply;

        btn.addEventListener("click", function(e) {
          e.preventDefault();
          const msg = this.dataset.message;
          if (msg && !isProcessing) {
            inputEl.value = msg;
            sendMessage();
          }
        });

        quickRepliesEl.appendChild(btn);
      });

      // Hide chips after 15 seconds if unclicked
      clearTimeout(quickReplyTimer);
      quickReplyTimer = setTimeout(() => {
        if (quickRepliesEl) quickRepliesEl.style.display = "none";
      }, 15000);
    }

    // ─── Send Message Pipeline with Abort Support ──────────────────────────────
    async function sendMessage() {
      // If already processing and button clicked, act as Stop!
      if (isProcessing) {
        stopGenerating();
        return;
      }

      const message = inputEl.value.trim();
      if (!message || !isLoggedIn) return;

      // Clear & set UI state
      inputEl.value = "";
      setGeneratingState(true);

      if (quickRepliesEl) {
        quickRepliesEl.style.display = "none";
        clearTimeout(quickReplyTimer);
      }

      // Record & display user message
      const history = getChatHistory();
      const userTimestamp = Date.now();
      history.push({
        role: "user",
        text: message,
        timestamp: userTimestamp,
      });
      saveChatHistory(history);
      renderMessage("user", message, [], userTimestamp);

      // Display typing indicator
      showTyping();

      // Create new AbortController instance for this request
      activeAbortController = new AbortController();

      try {
        const response = await fetch("/ai/chat/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCsrfToken(),
          },
          body: JSON.stringify({ message }),
          credentials: "same-origin",
          signal: activeAbortController.signal,
        });

        removeTyping();

        if (!response.ok) {
          throw new Error(`Server returned status ${response.status}`);
        }

        const data = await response.json();
        const replyText = data.response || "I could not find an answer at the moment.";
        const suggestions = Array.isArray(data.suggestions) ? data.suggestions : [];
        const botTimestamp = Date.now();

        // Save bot response
        history.push({
          role: "bot",
          text: replyText,
          suggestions: suggestions,
          timestamp: botTimestamp,
        });
        saveChatHistory(history);

        renderMessage("bot", replyText, suggestions, botTimestamp);

        // Display quick replies
        if (data.quick_replies && data.quick_replies.length > 0) {
          renderQuickReplies(data.quick_replies);
        }

      } catch (error) {
        removeTyping();

        // Handle user-initiated stop
        if (error.name === "AbortError") {
          const stoppedNotice = "Response was stopped.";
          history.push({
            role: "bot",
            text: stoppedNotice,
            suggestions: [],
            timestamp: Date.now(),
            isStopped: true,
          });
          saveChatHistory(history);
          renderMessage("bot", stoppedNotice, [], Date.now(), true);
          return;
        }

        console.error("Vendora Chatbot Error:", error);
        const fallbackText = "I'm having a brief issue connecting to my catalog. Please ask again or browse our categories!";
        history.push({
          role: "bot",
          text: fallbackText,
          suggestions: [],
          timestamp: Date.now(),
        });
        saveChatHistory(history);
        renderMessage("bot", fallbackText, [], Date.now());
        updateStatus("Connection issue", "offline");

      } finally {
        activeAbortController = null;
        setGeneratingState(false);
      }
    }

    // ─── Fullscreen Toggle ─────────────────────────────────────────────────────
    function toggleFullscreen() {
      isFullscreen = !isFullscreen;
      windowEl.classList.toggle('fullscreen', isFullscreen);
      const icon = fullscreenBtn.querySelector('i');
      if (isFullscreen) {
        icon.className = 'fas fa-compress';
        fullscreenBtn.title = 'Exit full screen';
        document.body.style.overflow = 'hidden';
      } else {
        icon.className = 'fas fa-expand';
        fullscreenBtn.title = 'Full screen';
        document.body.style.overflow = '';
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ─── Window Visibility Controls ────────────────────────────────────────────
    function toggleChat() {
      if (!isLoggedIn) {
        guestEl.style.display = (guestEl.style.display === "block") ? "none" : "block";
        return;
      }

      const isOpen = windowEl.classList.contains('open');
      if (!isOpen) {
        windowEl.classList.add('open');
        guestEl.style.display = "none";
        renderHistory();
        setTimeout(() => inputEl.focus(), 150);

        // Show welcome quick replies if fresh
        const history = getChatHistory();
        if (history.length <= 1) {
          renderQuickReplies([
            { label: "🔥 Trending", message: "trending products" },
            { label: "📂 Categories", message: "what are your categories" },
            { label: "⭐ Featured", message: "featured products" },
            { label: "❓ What can you do?", message: "help" }
          ]);
        }
      } else {
        closeChat();
      }
    }

    function closeChat() {
      windowEl.classList.remove('open');
      if (isFullscreen) toggleFullscreen();
      document.body.style.overflow = '';
      if (quickRepliesEl) quickRepliesEl.style.display = "none";
    }

    // ─── Event Listeners ───────────────────────────────────────────────────────
    toggleBtn.addEventListener("click", toggleChat);
    closeBtn.addEventListener("click", closeChat);

    // Stop button in banner & send button click
    sendBtn.addEventListener("click", sendMessage);
    if (stopBtn) stopBtn.addEventListener("click", stopGenerating);

    // Fullscreen toggle
    fullscreenBtn.addEventListener("click", toggleFullscreen);

    // Clear history flow
    clearBtn.addEventListener("click", () => {
      clearConfirmEl.style.display = "flex";
    });

    confirmClearBtn.addEventListener("click", () => {
      clearConfirmEl.style.display = "none";
      saveChatHistory([]);
      renderHistory();
      updateStatus("Conversation cleared", "online");
    });

    cancelClearBtn.addEventListener("click", () => {
      clearConfirmEl.style.display = "none";
    });

    // Keyboard controls
    inputEl.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    // Escape closes confirmation or window, or stops generating
    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        if (isProcessing) {
          stopGenerating();
          return;
        }
        if (clearConfirmEl.style.display === "flex") {
          clearConfirmEl.style.display = "none";
          return;
        }
        if (windowEl.classList.contains('open')) {
          closeChat();
        }
      }
    });

    // Close guest popover if clicked outside
    document.addEventListener("click", function(event) {
      const chatbot = document.getElementById("vendoraChatbot");
      if (!chatbot) return;
      if (!isLoggedIn && guestEl.style.display === "block" && !chatbot.contains(event.target)) {
        guestEl.style.display = "none";
      }
    });

    // Initialize state
    if (isLoggedIn) {
      renderHistory();
      updateStatus("Ready to assist", "online");
    }

  })();
</script>
